[project]
name = "magus"
version = "0.1.0"
description = "Magus — 집필 RAG MCP 서버 (세 책장: Casper·Melchior·Balthasar)"
readme = "README.md"
authors = [
    { name = "sml122900", email = "sml122900@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "numpy>=2.5.3",
    "pymupdf>=1.28.2",
    "pypandoc-binary>=1.17",
    "python-docx>=1.2.0",
]

[project.scripts]
magus = "magus.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
