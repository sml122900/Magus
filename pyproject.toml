[project]
name = "magus"
version = "0.1.0"
description = "Magus — 집필 RAG MCP 서버 (세 책장: Casper·Melchior·Balthasar)"
readme = "README.md"
authors = [
    { name = "sml122900", email = "sml122900@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "lxml>=6.1.3",  # docx_reader·extract가 직접 쓴다(전에는 python-docx를 통해서만 들어옴, 점검 20-3)
    "mcp>=2.2.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=1.28.2",
    "pypandoc-binary>=1.17",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
magus = "magus.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",  # 린트(CLAUDE.md 개발 명령, 점검 20-3)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rs"  # 건너뛴 시험의 사유를 끝에 보인다(점검 24-d: 브라우저 시험)
